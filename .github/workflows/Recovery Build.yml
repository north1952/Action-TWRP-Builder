name: Recovery Build
on:
  workflow_dispatch:
    inputs:
      BUILD_TARGET:
        required: false
        default: vendorboot
  push:
    branches: [main, standalone-recovery]
    paths: ['.github/workflows/Recovery Build.yml']
concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      MANIFEST: https://github.com/TWRP-Test/platform_manifest_twrp_aosp
      MANIFEST_BRANCH: twrp-16.0
      TREE: https://github.com/north1952/twrp_device_xiaomi_byron
      TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH || (github.ref_name == 'standalone-recovery' && 'standalone-recovery' || 'main') }}
      DEVICE_PATH: device/xiaomi/sm8750_thales
      DEVICE_NAME: sm8750_thales
      MAKEFILE: twrp_sm8750_thales
      PRODUCT_NINJA: twrp_sm8750_thales
      TARGET: ${{ github.event.inputs.BUILD_TARGET || (github.ref_name == 'standalone-recovery' && 'recovery' || 'vendorboot') }}
      LOG: ${{ github.workspace }}/build.log
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: rokibhasansagar/slimhub_actions@main
    - name: free-disk
      run: |
        set +e
        echo "=== disk before ==="
        df -h /
        sudo rm -rf /usr/local/lib/android 2>/dev/null
        sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null
        sudo rm -rf /usr/share/dotnet 2>/dev/null
        sudo rm -rf /usr/local/.ghcup 2>/dev/null
        sudo rm -rf /usr/share/swift 2>/dev/null
        docker image prune -af >/dev/null 2>&1
        sudo apt-get clean >/dev/null 2>&1
        echo "=== disk after ==="
        df -h /
    - name: deps
      run: sudo apt-get update && sudo apt-get install -yq linux-modules-extra-$(uname -r) gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '21'
    - name: repo
      run: mkdir -p ~/bin && curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo && sudo ln -sf ~/bin/repo /usr/bin/repo
    - name: init
      id: pwd
      run: mkdir -p workspace && cd workspace && echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT" && git config --global user.name ci && git config --global user.email ci@example.com && repo init --depth=1 -u "$MANIFEST" -b "$MANIFEST_BRANCH"
    - name: sync
      working-directory: workspace
      run: repo sync -j$(nproc --all) --force-sync
    - name: tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: git clone "$TREE" -b "$TREE_BRANCH" "./$DEVICE_PATH"
    - uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
    - name: build
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # V9: 跳过 LLNDK ABI 一致性检查。
        # 根因（V8 build.log line 6372）：全库仅 libbinder_ndk.so.llndk.abidiff 失败，
        # liblog / libvndksupport / libbinder_ndk.llndk34 同参考(vndk/202404)全部通过，
        # 说明 manifest 2026-09-11 "Track AOSP 17 UBLK" 使 frameworks/native 新于参考 dump。
        # 官方逃生门：build/soong/cc/sabi.go -> IsEnvTrue("SKIP_ABI_CHECKS") 直接 return。
        export SKIP_ABI_CHECKS=true
        export WITH_DEXPREOPT=false
        export DISABLE_DEXPREOPT=true
        : > "$LOG"
        {
          echo "=== preflight ==="
          date -u
          df -h
          free -h
          nproc
          ls -1 build/release/flag_values
          ls -la "$DEVICE_PATH"
        } >> "$LOG" 2>&1
        IMG="${TARGET}image"
        echo "::notice::target resolved to $IMG"
        (
          cd "$GITHUB_WORKSPACE" || exit 0
          gh release create "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --title "byron-twrp-$GITHUB_RUN_ID" --notes "live build log" >/dev/null 2>&1 || true
          while true; do
            sleep 180
            cp "$LOG" "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
            gh release upload "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" build.log --clobber >/dev/null 2>&1 || true
          done
        ) &
        LIVE=$!
        trap 'kill $LIVE 2>/dev/null || true' EXIT
        L=""
        # V9: bp2a = android-16.0.0_r1（manifest default.xml 锁定的 tag），为 TWRP twrp-16.0 官方写法
        # （MissMyTime docs/BUILD.md 明确要求 BP2A，且有 "Wrong lunch target" 专节）。
        # V8 误用 ap2a（Android 14/15 代）；preflight 实测树内可用 release:
        #   ap2a ap3a ap4a bp1a bp2a eng userdebug
        for c in "$MAKEFILE-bp2a-eng" "$MAKEFILE-ap3a-eng" "$MAKEFILE-ap4a-eng" "$MAKEFILE-eng"; do
          unset TARGET_PRODUCT TARGET_RELEASE TARGET_BUILD_VARIANT
          lunch "$c" >> "$LOG" 2>&1 || true
          if [ -n "$TARGET_PRODUCT" ]; then L="$c"; break; fi
        done
        if [ -z "$L" ]; then echo "::error::no valid lunch combo for $MAKEFILE"; fi
        echo "::notice::lunched $L -> $TARGET_PRODUCT $TARGET_RELEASE $TARGET_BUILD_VARIANT"
        OUT="out/target/product/$DEVICE_NAME"
        publish() {
          tail -n 240 "$LOG" > "$GITHUB_WORKSPACE/build_tail.log"
          grep -nE "error:|FAILED:|ninja: build stopped|No space left|No rule to make|internal compiler error|fatal error|undefined reference|signal|Killed|Out of memory" "$LOG" | tail -n 40 > "$GITHUB_WORKSPACE/errs.txt" || true
          i=0
          while IFS= read -r line; do
            i=$((i+1)); [ "$i" -gt 15 ] && break
            printf "::error::[%s] %s" "$1" "$line" | cut -c1-900
            echo
          done < "$GITHUB_WORKSPACE/errs.txt"
        }
        set +e
        make "$IMG" -j4 >> "$LOG" 2>&1
        echo "::notice::$IMG rc=$?"
        for t in vendorbootimage bootimage recoveryimage; do
          if ls "$OUT"/*.img > /dev/null 2>&1; then break; fi
          if [ "$t" = "$IMG" ]; then continue; fi
          make "$t" -j4 >> "$LOG" 2>&1
          echo "::notice::$t rc=$?"
        done
        ls -la "$OUT" >> "$LOG" 2>&1
        df -h >> "$LOG" 2>&1
        publish compile
        kill $LIVE 2>/dev/null || true
        trap - EXIT
    - uses: softprops/action-gh-release@v2
      if: always()
      with:
        files: |
          build.log
          build_tail.log
          errs.txt
          workspace/out/target/product/${{ env.DEVICE_NAME }}/*.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/*.img.md5
          workspace/out/target/product/${{ env.DEVICE_NAME }}/*.zip
        fail_on_unmatched_files: false
        tag_name: ${{ github.run_id }}
        name: byron-twrp-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: verify
      if: always()
      run: |
        if ls workspace/out/target/product/${{ env.DEVICE_NAME }}/*.img > /dev/null 2>&1; then
          echo "::notice::image present, build succeeded"
        else
          echo "::error::no image produced by $TARGET build"
          exit 1
        fi
